<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KampusFind - Lost & Found & Nebeng Kampus</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b132b;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-12">

  <!-- Header / Navbar -->
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎓</span>
        <div>
          <h1 class="text-xl font-extrabold text-cyan-400 tracking-wide">KampusFind</h1>
          <p class="text-[11px] text-slate-400">Hub Lost & Found + Nebeng Kampus UTDI</p>
        </div>
      </div>
      <button id="openModalBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition active:scale-95 flex items-center gap-1.5 shadow-lg shadow-cyan-500/20">
        <span>➕</span> Buat Posting Baru
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- Tab Navigation -->
    <div class="flex bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 text-sm font-semibold">
      <button id="tabLostFound" class="tab-btn flex-1 py-2.5 rounded-xl text-center transition bg-cyan-500 text-slate-950 font-bold shadow">
        🔍 Lost & Found (Barang Hilang)
      </button>
      <button id="tabNebeng" class="tab-btn flex-1 py-2.5 rounded-xl text-center transition text-slate-400 hover:text-white">
        🚗 Board Nebeng Kampus
      </button>
    </div>

    <!-- Search & Filter Bar -->
    <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row gap-3">
      <div class="flex-1 relative">
        <input type="text" id="searchInput" placeholder="Cari nama barang, lokasi, atau rute nebeng..." 
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 pl-10">
        <span class="absolute left-3.5 top-3 text-slate-500 text-sm">🔎</span>
      </div>
      <select id="filterCategory" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        <option value="semua">Semua Kategori</option>
        <option value="hilang">🔴 Barang Hilang</option>
        <option value="ditemukan">🟢 Barang Ditemukan</option>
        <option value="nebeng_tebangan">🚗 Beri Tebangan</option>
        <option value="nebeng_cari">🙋‍♂️ Cari Tebangan</option>
      </select>
    </div>

    <!-- Container Kartu Postingan -->
    <div id="postsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Item postingan dimuat via JS -->
    </div>

  </main>

  <!-- MODAL FORM INPUT POSTINGAN -->
  <div id="modalForm" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-cyan-400">Buat Posting Baru</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
      </div>

      <form id="postForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Tipe Posting</label>
          <select id="postType" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500">
            <option value="hilang">🔴 Lost & Found: Barang Hilang</option>
            <option value="ditemukan">🟢 Lost & Found: Barang Ditemukan</option>
            <option value="nebeng_tebangan">🚗 Nebeng: Ada Lapak Tebangan Motor/Mobil</option>
            <option value="nebeng_cari">🙋‍♂️ Nebeng: Butuh Tebangan / Boncengan</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Judul / Nama Barang / Rute</label>
          <input type="text" id="postTitle" required placeholder="Cth: KTM atas nama Budi / Nebeng ke Janti" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Lokasi / Titik Kumpul</label>
          <input type="text" id="postLocation" required placeholder="Cth: Perpustakaan Lantai 2 / Depan Gerbang Utama" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Deskripsi Ringkas</label>
          <textarea id="postDesc" rows="2" required placeholder="Cth: Kunci motor Honda gantungan dompet hitam. Ditemukan jam 10 pagi." 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nomor WhatsApp (Aktif)</label>
          <input type="text" id="postWa" required placeholder="Cth: 081234567890" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">URL Foto (Opsional)</label>
          <input type="url" id="postImg" placeholder="https://... (Biarkan kosong jika tidak ada foto)" 
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white focus:border-cyan-500">
        </div>

        <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg">
          🚀 Terbitkan Posting
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Mock Data Awal (biar aplikasi tidak kosong saat pertama dibuka juri)
    const initialPosts = [
      {
        id: 1,
        type: "ditemukan",
        title: "KTM UTDI a.n Rian Prasetya",
        location: "Gedung A R.302",
        desc: "Ditemukan terselip di bawah meja kelas jam 12 siang. Sudah diamankan di Satpam.",
        wa: "081234567890",
        img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=60",
        date: "Hari ini, 12:30",
        status: "aktif"
      },
      {
        id: 2,
        type: "nebeng_tebangan",
        title: "Nebeng Motor ke arah Malioboro / Stasiun Tugu",
        location: "Kumpul di Parkiran Motor Belakang",
        desc: "Sisa 1 slot helm. Jalan jam 16:30 pas kelar kuliah. Bayar seikhlasnya / ganti es teh.",
        wa: "089876543210",
        img: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500&auto=format&fit=crop&q=60",
        date: "Hari ini, 14:00",
        status: "aktif"
      }
    ];

    let posts = JSON.parse(localStorage.getItem('kampus_find_posts')) || initialPosts;
    let currentTab = 'lost_found'; // 'lost_found' atau 'nebeng'

    // DOM Elements
    const postsGrid = document.getElementById('postsGrid');
    const modalForm = document.getElementById('modalForm');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const postForm = document.getElementById('postForm');
    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const tabLostFound = document.getElementById('tabLostFound');
    const tabNebeng = document.getElementById('tabNebeng');

    // Save Data
    function saveData() {
      localStorage.setItem('kampus_find_posts', JSON.stringify(posts));
    }

    // Format Nomor WA ke format Internasional (62)
    function formatWaNumber(wa) {
      let cleaned = wa.replace(/\D/g, '');
      if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.slice(1);
      }
      return cleaned;
    }

    // Badge Style & Label Generator
    function getBadge(type) {
      switch(type) {
        case 'hilang': return `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/40 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">🔴 Barang Hilang</span>`;
        case 'ditemukan': return `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">🟢 Barang Ditemukan</span>`;
        case 'nebeng_tebangan': return `<span class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">🚗 Ada Tebangan</span>`;
        case 'nebeng_cari': return `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">🙋‍♂️ Cari Tebangan</span>`;
      }
    }

    // Render Cards
    function renderPosts() {
      postsGrid.innerHTML = '';
      
      const search = searchInput.value.toLowerCase();
      const cat = filterCategory.value;

      const filtered = posts.filter(item => {
        // Filter Berdasarkan Tab Aktif
        const matchTab = currentTab === 'lost_found' 
          ? (item.type === 'hilang' || item.type === 'ditemukan')
          : (item.type === 'nebeng_tebangan' || item.type === 'nebeng_cari');

        // Filter Search & Category
        const matchSearch = item.title.toLowerCase().includes(search) || 
                            item.location.toLowerCase().includes(search) || 
                            item.desc.toLowerCase().includes(search);
        const matchCat = (cat === 'semua') || (item.type === cat);

        return matchTab && matchSearch && matchCat;
      });

      if (filtered.length === 0) {
        postsGrid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-slate-900/40 rounded-2xl border border-slate-800/80">
            <span class="text-4xl block mb-2">📭</span>
            <p class="text-slate-400 text-sm font-semibold">Belum ada postingan di kategori ini.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const waClean = formatWaNumber(item.wa);
        const waText = encodeURIComponent(`Halo, saya lihat postingan kamu di KampusFind mengenai: "${item.title}". Apakah masih ada/tersedia?`);
        const waUrl = `https://wa.me/${waClean}?text=${waText}`;

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition shadow-xl space-y-3";
        
        const defaultImg = 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500&auto=format&fit=crop&q=60';
        const imgUrl = item.img && item.img.trim() !== '' ? item.img : defaultImg;

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2 gap-2">
              ${getBadge(item.type)}
              <span class="text-[10px] text-slate-500 font-medium">${item.date}</span>
            </div>
            
            ${item.type.includes('hilang') || item.type.includes('ditemukan') ? `
              <img src="${imgUrl}" alt="${item.title}" class="w-full h-36 object-cover rounded-xl mb-3 border border-slate-800">
            ` : ''}

            <h3 class="font-bold text-base text-white leading-snug">${item.title}</h3>
            <p class="text-xs text-cyan-400/90 font-medium mt-1 flex items-center gap-1">
              <span>📍</span> ${item.location}
            </p>
            <p class="text-xs text-slate-300 mt-2 leading-relaxed bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/50">
              ${item.desc}
            </p>
          </div>

          <div class="pt-2 border-t border-slate-800/80 flex gap-2">
            <a href="${waUrl}" target="_blank" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl text-center transition flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-600/20">
              <span>💬</span> Hubungi via WA
            </a>
            <button onclick="deletePost(${item.id})" class="bg-slate-800 hover:bg-rose-950/50 text-slate-400 hover:text-rose-400 p-2.5 rounded-xl text-xs transition border border-slate-700" title="Hapus Posting">
              🗑️
            </button>
          </div>
        `;
        postsGrid.appendChild(card);
      });
    }

    // Delete Post
    window.deletePost = function(id) {
      if (confirm("Hapus postingan ini?")) {
        posts = posts.filter(p => p.id !== id);
        saveData();
        renderPosts();
      }
    }

    // Switch Tabs
    tabLostFound.addEventListener('click', () => {
      currentTab = 'lost_found';
      tabLostFound.className = "tab-btn flex-1 py-2.5 rounded-xl text-center transition bg-cyan-500 text-slate-950 font-bold shadow";
      tabNebeng.className = "tab-btn flex-1 py-2.5 rounded-xl text-center transition text-slate-400 hover:text-white";
      renderPosts();
    });

    tabNebeng.addEventListener('click', () => {
      currentTab = 'nebeng';
      tabNebeng.className = "tab-btn flex-1 py-2.5 rounded-xl text-center transition bg-cyan-500 text-slate-950 font-bold shadow";
      tabLostFound.className = "tab-btn flex-1 py-2.5 rounded-xl text-center transition text-slate-400 hover:text-white";
      renderPosts();
    });

    // Form Event
    postForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newPost = {
        id: Date.now(),
        type: document.getElementById('postType').value,
        title: document.getElementById('postTitle').value.trim(),
        location: document.getElementById('postLocation').value.trim(),
        desc: document.getElementById('postDesc').value.trim(),
        wa: document.getElementById('postWa').value.trim(),
        img: document.getElementById('postImg').value.trim(),
        date: 'Baru saja',
        status: 'aktif'
      };

      posts.unshift(newPost);
      saveData();
      renderPosts();
      
      postForm.reset();
      modalForm.classList.add('hidden');
    });

    // Modal Control
    openModalBtn.addEventListener('click', () => modalForm.classList.remove('hidden'));
    closeModalBtn.addEventListener('click', () => modalForm.classList.add('hidden'));

    // Filter Listeners
    searchInput.addEventListener('input', renderPosts);
    filterCategory.addEventListener('change', renderPosts);

    // Initial Render
    renderPosts();
  </script>
</body>
</html>

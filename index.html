<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Budget: Survive the Month</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts CDN (bukan npm/node) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixel-border: #0f0f1a;
    }
    * { image-rendering: pixelated; }
    body {
      font-family: 'VT323', monospace;
      background-color: #14142b;
      background-image:
        linear-gradient(#1c1c3a 1px, transparent 1px),
        linear-gradient(90deg, #1c1c3a 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .font-pixel { font-family: 'Press Start 2P', cursive; }

    /* Pixel-art border: hard edges, no radius, layered box-shadow "bevel" */
    .pixel-panel {
      border-radius: 0;
      border: 4px solid var(--pixel-border);
      box-shadow:
        0 0 0 2px #4a4a7a,
        6px 6px 0 0 var(--pixel-border);
    }
    .pixel-btn {
      border-radius: 0;
      border: 3px solid var(--pixel-border);
      box-shadow: 4px 4px 0 0 var(--pixel-border);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .pixel-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 0 var(--pixel-border);
    }
    .pixel-input {
      border-radius: 0;
      border: 3px solid var(--pixel-border);
      box-shadow: inset 3px 3px 0 0 rgba(0,0,0,0.35);
    }
    .pixel-chip {
      border-radius: 0;
      border: 2px solid var(--pixel-border);
      box-shadow: 3px 3px 0 0 var(--pixel-border);
      transition: transform 0.05s ease;
    }
    .pixel-chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--pixel-border); }
    .pixel-chip.active-chip {
      box-shadow: inset 2px 2px 0 0 rgba(0,0,0,0.4);
      transform: translate(2px, 2px);
    }

    /* Segmented HP bar, Mega Man style */
    .hp-segments {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 2px;
    }
    .hp-seg {
      height: 16px;
      background: #0f0f1a;
      border: 1px solid #000;
    }
    .hp-seg.filled-green { background: #3ddc84; }
    .hp-seg.filled-amber { background: #ffcc33; }
    .hp-seg.filled-red { background: #ff4d5e; }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .low-hp .filled-red { animation: pulse-red 0.8s infinite steps(2); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .shake { animation: shake 0.3s steps(2); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f0f1a; }
    ::-webkit-scrollbar-thumb { background: #4a4a7a; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Container -->
  <div class="max-w-md w-full bg-slate-800 pixel-panel p-6">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="font-pixel text-lg text-amber-400 uppercase flex items-center justify-center gap-2 leading-relaxed">
        <span>🎮</span> RPG Budget
      </h1>
      <p class="text-sm text-slate-400 mt-2 tracking-wide">Survive the Month without Going Broke!</p>
    </div>

    <!-- TAMPILAN 1: SETUP BUDGET AWAL -->
    <div id="setupSection" class="space-y-4">
      <div class="bg-slate-900/60 p-4 pixel-panel">
        <label class="font-pixel block text-[10px] text-slate-300 uppercase mb-3 leading-relaxed">
          Set Max HP (Target Budget Bulanan)
        </label>
        <div class="flex items-center gap-2">
          <span class="text-slate-400 text-lg font-bold">Rp</span>
          <input type="number" id="maxHpInput" placeholder="misal: 1500000"
            class="pixel-input w-full bg-slate-900 p-2.5 text-white text-lg focus:outline-none focus:border-amber-400">
        </div>
      </div>
      <button id="startBtn" class="font-pixel pixel-btn w-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs py-3 uppercase">
        🚀 Mulai Survival!
      </button>
    </div>

    <!-- TAMPILAN 2: DASHBOARD GAME (Awalnya tersembunyi) -->
    <div id="gameSection" class="hidden space-y-5">

      <!-- Status Bar & HP -->
      <div class="bg-slate-900/80 p-4 pixel-panel">
        <div class="flex justify-between items-center font-pixel text-[9px] mb-3">
          <span class="text-slate-300 leading-relaxed">DOMPET HP</span>
          <span id="hpText" class="text-amber-400 leading-relaxed">Rp 0 / Rp 0</span>
        </div>

        <!-- Segmented Health Bar -->
        <div id="hpSegments" class="hp-segments"></div>
      </div>

      <!-- Roasting Box -->
      <div class="bg-slate-950 pixel-panel p-4 text-center relative overflow-hidden">
        <span class="font-pixel text-[8px] text-amber-500/60 uppercase block mb-2 leading-relaxed">--- Komentar Sistem ---</span>
        <p id="roastText" class="text-base text-amber-200 italic leading-snug">
          "Aplikasi siap memantau gaya hidupmu!"
        </p>
      </div>

      <!-- Form Tambah Pengeluaran (Damage) -->
      <form id="expenseForm" class="space-y-3 bg-slate-900/40 pixel-panel p-4">
        <h3 class="font-pixel text-[9px] text-slate-400 uppercase leading-relaxed">Input Damage (Pengeluaran Baru)</h3>
        <div>
          <input type="text" id="expenseName" required placeholder="Nama pengeluaran (cth: Kopi Kenangan)"
            class="pixel-input w-full bg-slate-900 p-2 text-sm text-white focus:outline-none focus:border-rose-500">
        </div>
        <div class="flex gap-2">
          <select id="expenseCategory" class="pixel-input bg-slate-900 p-2 text-sm text-white focus:outline-none focus:border-rose-500">
            <option value="makanan">🍜 Makanan</option>
            <option value="hiburan">🎮 Hiburan</option>
            <option value="tagihan">💡 Tagihan</option>
            <option value="lainnya">📦 Lainnya</option>
          </select>
          <input type="number" id="expenseAmount" required placeholder="Nominal"
            class="pixel-input w-full bg-slate-900 p-2 text-sm text-white focus:outline-none focus:border-rose-500">
        </div>
        <button type="submit" class="font-pixel pixel-btn w-full bg-rose-600 hover:bg-rose-500 text-white text-[10px] py-2.5 uppercase">
          💥 Kena Damage
        </button>
      </form>

      <!-- Filter Kategori -->
      <div>
        <h3 class="font-pixel text-[9px] text-slate-400 uppercase mb-2 leading-relaxed">Filter Riwayat</h3>
        <div id="filterChips" class="flex flex-wrap gap-2">
          <button data-filter="semua" class="filter-chip pixel-chip active-chip bg-slate-700 text-white text-xs px-3 py-1.5">Semua</button>
          <button data-filter="makanan" class="filter-chip pixel-chip bg-slate-700 text-white text-xs px-3 py-1.5">🍜 Makanan</button>
          <button data-filter="hiburan" class="filter-chip pixel-chip bg-slate-700 text-white text-xs px-3 py-1.5">🎮 Hiburan</button>
          <button data-filter="tagihan" class="filter-chip pixel-chip bg-slate-700 text-white text-xs px-3 py-1.5">💡 Tagihan</button>
        </div>
      </div>

      <!-- Riwayat Pengeluaran -->
      <div>
        <h3 class="font-pixel text-[9px] text-slate-400 uppercase mb-2 leading-relaxed">Riwayat Damage Terbaru</h3>
        <ul id="historyList" class="space-y-1.5 max-h-32 overflow-y-auto pr-1">
          <!-- Item riwayat dimuat lewat JS -->
        </ul>
      </div>

      <!-- Reset Game -->
      <button id="resetBtn" class="pixel-btn w-full bg-slate-800 hover:bg-rose-900/30 text-slate-400 hover:text-rose-300 text-xs py-2">
        🔄 Reset Game / Mulai Bulan Baru
      </button>
    </div>

  </div>

  <!-- JS Logic -->
  <script>
    // State Aplikasi
    let state = {
      maxHp: 0,
      currentHp: 0,
      history: []
    };

    let activeFilter = 'semua';

    // DOM Elements
    const setupSection = document.getElementById('setupSection');
    const gameSection = document.getElementById('gameSection');
    const maxHpInput = document.getElementById('maxHpInput');
    const startBtn = document.getElementById('startBtn');
    const hpText = document.getElementById('hpText');
    const hpSegments = document.getElementById('hpSegments');
    const roastText = document.getElementById('roastText');
    const expenseForm = document.getElementById('expenseForm');
    const expenseName = document.getElementById('expenseName');
    const expenseAmount = document.getElementById('expenseAmount');
    const expenseCategory = document.getElementById('expenseCategory');
    const historyList = document.getElementById('historyList');
    const resetBtn = document.getElementById('resetBtn');
    const filterChips = document.querySelectorAll('.filter-chip');

    const CATEGORY_LABEL = {
      makanan: '🍜 Makanan',
      hiburan: '🎮 Hiburan',
      tagihan: '💡 Tagihan',
      lainnya: '📦 Lainnya'
    };

    // ===== Web Audio API: 8-bit hit sound =====
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playHitSound() {
      try {
        const ctx = getAudioCtx();
        // Beberapa "browser" butuh resume setelah gesture user pertama
        if (ctx.state === 'suspended') ctx.resume();

        const now = ctx.currentTime;
        const notes = [220, 165, 110]; // nada turun ala 8-bit "damage hit"

        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now + i * 0.07);
          gain.gain.setValueAtTime(0.15, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.07 + 0.09);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.1);
        });
      } catch (err) {
        // Kalau Web Audio API tidak didukung, cukup diamkan (fitur non-kritis)
        console.warn('Audio tidak tersedia:', err);
      }
    }

    // Daftar Teks Roasting Berdasarkan Persentase HP
    function getRoastMessage(percent) {
      if (percent >= 80) {
        return "Sultan baru gajian! Tapi ingat, ini baru awal bulan. Jangan sok kaya dulu.";
      } else if (percent >= 50) {
        return "HP dompet mulai berkurang. Kurang-kurangin nongkrong ngopi estetiknya ya!";
      } else if (percent >= 25) {
        return "WARNING! Nyawa dompet sekarat! Siap-siap makan mie instan campur nasi sampai akhir bulan.";
      } else if (percent > 0) {
        return "CRITICAL CONDITION! Tinggal satu pukulan lagi kamu langsung broke! Jangan berani-berani lirik promo online shop!";
      } else {
        return "GAME OVER! Dompetmu resmi almarhum bulan ini. Silakan merenung di pojokan.";
      }
    }

    // Format Rupiah
    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
    }

    // Load Data dari LocalStorage
    function loadData() {
      const savedState = localStorage.getItem('rpg_budget_data');
      if (savedState) {
        const parsed = JSON.parse(savedState);
        // Kompatibilitas data lama yang belum punya field category
        parsed.history = (parsed.history || []).map(item => ({
          category: 'lainnya',
          ...item
        }));
        state = parsed;
        renderGame();
      }
    }

    // Save Data ke LocalStorage
    function saveData() {
      localStorage.setItem('rpg_budget_data', JSON.stringify(state));
    }

    // Render segmented HP bar (20 kotak, mirip life bar Mega Man)
    function renderHpSegments(percent) {
      const totalSegments = 20;
      const filledCount = Math.round((percent / 100) * totalSegments);
      let colorClass = 'filled-green';
      if (percent <= 50) colorClass = 'filled-amber';
      if (percent <= 25) colorClass = 'filled-red';

      hpSegments.innerHTML = '';
      hpSegments.classList.toggle('low-hp', percent <= 25);
      for (let i = 0; i < totalSegments; i++) {
        const seg = document.createElement('div');
        seg.className = 'hp-seg' + (i < filledCount ? ` ${colorClass}` : '');
        hpSegments.appendChild(seg);
      }
    }

    // Update UI Game
    function renderGame() {
      if (state.maxHp <= 0) {
        setupSection.classList.remove('hidden');
        gameSection.classList.add('hidden');
        return;
      }

      setupSection.classList.add('hidden');
      gameSection.classList.remove('hidden');

      // Hitung Persentase HP
      const percent = Math.max(0, Math.min(100, Math.round((state.currentHp / state.maxHp) * 100)));

      // Update Text & Segmented Bar
      hpText.textContent = `${formatRupiah(state.currentHp)} / ${formatRupiah(state.maxHp)}`;
      renderHpSegments(percent);

      // Update Teks Roasting
      roastText.textContent = `"${getRoastMessage(percent)}"`;

      renderHistory();
    }

    // Render Riwayat Pengeluaran (menghormati filter kategori aktif)
    function renderHistory() {
      historyList.innerHTML = '';

      const filtered = activeFilter === 'semua'
        ? state.history
        : state.history.filter(item => item.category === activeFilter);

      if (filtered.length === 0) {
        historyList.innerHTML = `<li class="text-sm text-slate-500 italic">Belum ada damage terdeteksi.</li>`;
        return;
      }

      filtered.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-900 p-2 pixel-chip text-sm";
        const label = CATEGORY_LABEL[item.category] || CATEGORY_LABEL.lainnya;
        li.innerHTML = `
          <span class="text-slate-300 font-medium">${label} · ${item.name}</span>
          <span class="text-rose-400 font-bold">-${formatRupiah(item.amount)}</span>
        `;
        historyList.appendChild(li);
      });
    }

    // Event Listeners
    startBtn.addEventListener('click', () => {
      const val = parseInt(maxHpInput.value);
      if (isNaN(val) || val <= 0) {
        alert("Masukkan nominal budget yang valid!");
        return;
      }
      state.maxHp = val;
      state.currentHp = val;
      state.history = [];
      saveData();
      renderGame();
    });

    expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = expenseName.value.trim();
      const amount = parseInt(expenseAmount.value);
      const category = expenseCategory.value;

      if (!name || isNaN(amount) || amount <= 0) return;

      state.currentHp -= amount;
      state.history.push({ name, amount, category });
      saveData();
      renderGame();
      playHitSound();

      // Efek shake ringan pada panel HP saat kena damage
      const hpPanel = hpSegments.closest('.pixel-panel');
      hpPanel.classList.remove('shake');
      void hpPanel.offsetWidth; // reflow supaya animasi bisa diulang
      hpPanel.classList.add('shake');

      expenseName.value = '';
      expenseAmount.value = '';
      expenseName.focus();
    });

    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        activeFilter = chip.dataset.filter;
        filterChips.forEach(c => c.classList.remove('active-chip'));
        chip.classList.add('active-chip');
        renderHistory();
      });
    });

    resetBtn.addEventListener('click', () => {
      if (confirm("Yakin mau reset game? Seluruh data pengeluaran bulan ini akan dihapus.")) {
        localStorage.removeItem('rpg_budget_data');
        state = { maxHp: 0, currentHp: 0, history: [] };
        activeFilter = 'semua';
        maxHpInput.value = '';
        renderGame();
      }
    });

    // Inisialisasi saat halaman dimuat
    loadData();
  </script>
</body>
</html>
